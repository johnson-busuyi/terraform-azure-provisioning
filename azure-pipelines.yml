
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  EnableTerraformDeployment: 'false'

stages:
  # ============================================
  # STAGE 1: TERRAFORM VALIDATION AND PLAN
  # ============================================
  - stage: Terraform_Plan
    displayName: 'Terraform Validation and Plan'
    jobs:
      - job: Plan
        displayName: 'Validate and Plan'
        steps:
          - checkout: self
            displayName: 'Checkout Terraform Repository'

          # Install Terraform
          - bash: |
              set -e
              TERRAFORM_VERSION=1.16.0

              curl -fsSLo terraform.zip \
                "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

              unzip -o terraform.zip
              sudo install terraform /usr/local/bin/terraform

              terraform version
            displayName: 'Install Terraform'

          # Check formatting
          - bash: terraform fmt -check -recursive
            displayName: 'Check Terraform Formatting'

          # Initialize without remote backend
          - bash: terraform init -backend=false -input=false
            displayName: 'Initialize Terraform'

          # Validate Terraform configuration
          - bash: terraform validate -no-color
            displayName: 'Validate Terraform Configuration'

          # Authenticate to Azure and generate saved plan
          - task: AzureCLI@2
            displayName: 'Terraform Plan - Remote State'
            inputs:
              azureSubscription: 'terraform-azure-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                set -e

                export ARM_USE_OIDC=true
                export ARM_USE_MSI=false
                export ARM_USE_AZUREAD=true

                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                echo "Initializing Terraform remote backend..."
                terraform init -reconfigure -input=false

                echo "Generating and saving Terraform Plan..."
                terraform plan -input=false -no-color -out=tfplan

                echo "Displaying Terraform Plan..."
                terraform show -no-color tfplan

          # Publish saved Terraform plan
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Plan Artifact'
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/tfplan'
              artifact: 'terraform-plan'
              publishLocation: 'pipeline'

  # ============================================
  # STAGE 2: APPROVAL-PROTECTED DEPLOYMENT
  # ============================================
  - stage: Terraform_Deploy
    displayName: 'Terraform Deployment - Approval Required'
    dependsOn: Terraform_Plan
    condition: and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['EnableTerraformDeployment'], 'true')
      )
    jobs:
      - deployment: Deploy
        displayName: 'Protected Terraform Deployment'
        environment: 'terraform-production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # Install Terraform for deployment
                - bash: |
                    set -e
                    TERRAFORM_VERSION=1.16.0

                    curl -fsSLo terraform.zip \
                      "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

                    unzip -o terraform.zip
                    sudo install terraform /usr/local/bin/terraform

                    terraform version
                  displayName: 'Install Terraform for Deployment'

                # Download saved Terraform plan
                - download: current
                  artifact: terraform-plan
                  displayName: 'Download Terraform Plan Artifact'

                # Verify downloaded plan
                - bash: |
                    set -e

                    echo "Checking saved Terraform plan..."

                    PLAN_FILE="$(Pipeline.Workspace)/terraform-plan/tfplan"

                    if [ ! -f "$PLAN_FILE" ]; then
                      echo "ERROR: Terraform plan file not found."
                      exit 1
                    fi

                    echo "Terraform plan artifact found successfully."
                  displayName: 'Verify Downloaded Terraform Plan'

                # Authenticate, initialize backend, and apply saved plan
                - task: AzureCLI@2
                  displayName: 'Terraform Apply - Approved Plan'
                  inputs:
                    azureSubscription: 'terraform-azure-connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -e

                      export ARM_USE_OIDC=true
                      export ARM_USE_MSI=false
                      export ARM_USE_AZUREAD=true

                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                      echo "Authenticating to Azure..."
                      az account show --query "{name:name,id:id}" -o table

                      echo "Initializing Terraform remote backend..."
                      terraform init -reconfigure -input=false

                      echo "Terraform backend initialized successfully."

                      PLAN_FILE="$(Pipeline.Workspace)/terraform-plan/tfplan"

                      if [ ! -f "$PLAN_FILE" ]; then
                        echo "ERROR: Saved Terraform plan not found."
                        exit 1
                      fi

                      echo "Checking saved Terraform plan..."
                      terraform show -no-color "$PLAN_FILE"

                      echo "Applying approved Terraform plan..."
                      terraform apply -input=false -no-color "$PLAN_FILE"

                      echo "Terraform deployment completed successfully."
